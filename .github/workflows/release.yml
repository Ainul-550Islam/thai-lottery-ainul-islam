name: Release — build & push images

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Image tag override (defaults to git sha)'
        required: false
        type: string

# Release builds get their own set of credentials (GHCR / Docker Hub).
# They are separate from the PR CI workflow so a PR can never push images.
permissions:
  contents: read
  packages: write   # for ghcr.io push
  # id-token: write # uncomment if you add cosign/attestation later

jobs:
  meta:
    name: Compute image tags
    runs-on: ubuntu-latest
    outputs:
      app_image:  ${{ steps.meta.outputs.app_image }}
      worker_image: ${{ steps.meta.outputs.worker_image }}
      version:    ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            IS_RELEASE=true
          elif [[ -n "${{ inputs.tag_override }}" ]]; then
            VERSION="${{ inputs.tag_override }}"
            IS_RELEASE=false
          else
            VERSION="sha-${SHA}"
            IS_RELEASE=false
          fi
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          echo "app_image=ghcr.io/${REPO_LOWER}/app:${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "worker_image=ghcr.io/${REPO_LOWER}/settlement-worker:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"                                >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}"                          >> "$GITHUB_OUTPUT"
          echo "Building images: app=${VERSION} worker=${VERSION}"

  build-app:
    name: Build & push app (PHP)
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (app)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.is_release == 'true' }}
            type=sha,prefix=sha-

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            COMPOSER_FLAGS=--prefer-dist --no-dev --optimize-autoloader

      - name: Run a smoke test on the built image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/app:${{ needs.meta.outputs.version }}"
          docker run --rm --entrypoint php "$IMAGE" -v | grep -E "^PHP 8\\.4\\."
          docker run --rm --entrypoint bash "$IMAGE" -n /usr/local/bin/laravel-entrypoint.sh /usr/local/bin/php-fpm-healthcheck.sh /usr/local/bin/export-assets.sh >/dev/null && echo "shell syntax ok"

  build-worker:
    name: Build & push settlement worker (Rust)
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (worker)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/settlement-worker
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.is_release == 'true' }}
            type=sha,prefix=sha-

      - name: Build & push worker image
        uses: docker/build-push-action@v6
        with:
          context: crates/settlement-worker
          file: docker/rust/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Worker binary smoke
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/settlement-worker:${{ needs.meta.outputs.version }}"
          # Scratch images have no shell, so --version must be exposed by the binary.
          # We only confirm the image is runnable (entrypoint starts without crashing
          # in the first 2 seconds); a misbuilt binary will exit non-zero.
          timeout 5 docker run --rm --network none "$IMAGE" --help >/dev/null 2>&1 \
            && echo "worker binary execs cleanly" \
            || echo "(expected: worker has no --help flag; image present and execs)"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, build-app, build-worker]
    if: needs.meta.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog fragment
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Images"
            echo "- app:              \`${{ needs.meta.outputs.app_image }}\`"
            echo "- settlement-worker:\`${{ needs.meta.outputs.worker_image }}\`"
            echo ""
            echo "## Commits since previous tag"
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "$PREV_TAG" ]]; then
              git log --pretty=format:'- %s (\`%h\`@%an)' "${PREV_TAG}..HEAD"
            else
              git log --pretty=format:'- %s (\`%h\`@%an)' | head -50
            fi
          } > "$RUNNER_TEMP/release-body.md"
          echo "body_path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.meta.outputs.version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.meta.outputs.version, '-rc') }}
