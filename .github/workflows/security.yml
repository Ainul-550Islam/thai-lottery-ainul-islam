# =============================================================================
# Security & supply-chain gate.
#
# WHAT CHANGED FROM THE PREVIOUS WORKFLOW, AND WHY
# ------------------------------------------------
# * PHP 8.3 and Node 20 are replaced with the versions the application actually
#   requires (PHP 8.4, Node from .nvmrc). An audit that cannot install the
#   dependency tree audits nothing — the old jobs failed at install time.
# * `permissions: contents: read` at the top, because a vulnerability scan does
#   not need write access to anything.
# * Actions are pinned to commit SHAs.
# * Secret scanning is a reviewed script with an allowlist
#   (scripts/ci/scan-secrets.sh + .github/secret-scan-allowlist.txt) instead of
#   two inline greps over the whole tree, one of which matched "BEGIN RSA
#   PRIVATE KEY" inside this very documentation.
# * The lock files are treated as a supply-chain artifact: `composer validate
#   --strict` and an explicit `npm ci` (never `npm install`) prove the tree that
#   is audited is the tree that ships.
# =============================================================================

name: Security & Vulnerability Gate

on:
  push:
    branches: [main, master, develop, 'agent/**']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  php-dependencies:
    name: PHP dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, intl, sodium
          coverage: none

      - name: Validate manifest and install exactly the lock file
        run: |
          set -euo pipefail
          composer validate --no-check-publish --strict
          composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Audit installed packages
        run: |
          set -euo pipefail
          composer audit --no-interaction --abandoned=report

      - name: Assert the platform requirement is who we say it is
        run: |
          set -euo pipefail
          composer check-platform-reqs

  npm-dependencies:
    name: Front-end dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install the reviewed npm release
        run: |
          set -euo pipefail
          reviewed="$(node -p "require('./package.json').packageManager")"
          npm install -g "${reviewed#npm@}"
          echo "npm $(npm --version) (reviewed: ${reviewed})"

      - name: Install from the lock file
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The gate parses the complete audit JSON report and fails on any advisory
      # at any severity, dev dependencies included. Severity thresholds and
      # production-only audits are suppressions with extra steps, so this
      # repository does not use them (tests/dependencies/security-gate.test.mjs
      # enforces that).
      - name: Repository dependency security gate (complete audit)
        run: |
          set -euo pipefail
          npm run security:dependencies
          npm run test:dependencies

  secret-scan:
    name: Secrets & credential leak detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for committed-secret detection)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan tracked files
        run: bash scripts/ci/scan-secrets.sh

      - name: Scan the pushed commit range
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # The working tree can be clean while the pushed diff is not.
          BEFORE="${{ github.event.before }}"
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable before-SHA (force push or new branch); the tracked-file scan above is authoritative."
            exit 0
          fi
          git diff --name-only "${BEFORE}" "${{ github.sha }}" | head -500 > /tmp/changed.txt
          echo "Changed files: $(wc -l < /tmp/changed.txt)"
          if grep -E '(^|/)\.env(\.|$)' /tmp/changed.txt | grep -vE '\.(example|ci)$'; then
            echo "::error::this push adds a .env file"
            exit 1
          fi
          if grep -E '\.(pem|key|p12|jks)$' /tmp/changed.txt; then
            echo "::error::this push adds a private key or keystore file"
            exit 1
          fi

  static-security:
    name: Static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, intl, sodium
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Reject dangerous execution functions in production source
        run: |
          set -euo pipefail
          # `proc_open` and `popen` are permitted only in the backup/subprocess
          # services, where they are replaced by Symfony Process in argv form.
          if grep -rnE "\b(eval|passthru|shell_exec|system)\s*\(" \
               app/ config/ routes/ \
               --include='*.php' \
             | grep -vE "app/Support/Backup/|app/Services/Infrastructure/"; then
            echo "::error::Dangerous execution function detected in production application source."
            exit 1
          fi
          echo "No dangerous execution functions found."

      - name: Reject unescaped output sinks in Blade templates
        run: |
          set -euo pipefail
          # {!! !!} bypasses escaping. Every use must be a reviewed exception in
          # the allowlist file, because a stored XSS on a lottery wallet page is
          # an account takeover.
          if [ -f resources/views/.unescaped-output-allowlist ]; then
            ALLOWED="$(grep -vE '^\s*(#|$)' resources/views/.unescaped-output-allowlist || true)"
          else
            ALLOWED=""
          fi

          FOUND=0
          while IFS= read -r hit; do
            file="${hit%%:*}"
            if [ -n "${ALLOWED}" ] && printf '%s\n' "${ALLOWED}" | grep -qxF "${file}"; then
              continue
            fi
            echo "::error file=${file}::unescaped Blade output outside the reviewed allowlist"
            FOUND=1
          done < <(grep -rn '{!!' resources/views --include='*.blade.php' || true)

          [ "${FOUND}" -eq 0 ] || exit 1
          echo "Unescaped-output review passed."

      - name: Assert the production safety contract still refuses unsafe boots
        run: |
          set -euo pipefail
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $violations = App\Providers\ProductionSafetyServiceProvider::violations();
            foreach ($violations as $violation) { echo "  - ", $violation, PHP_EOL; }
            echo count($violations), " violation(s) recorded under APP_ENV=", config("app.env"), PHP_EOL;
          '
