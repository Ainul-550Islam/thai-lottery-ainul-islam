name: Signed Android APK

# Builds, signs, and verifies the public Android release described in
# android/README.md. The workflow is manual (workflow_dispatch) on purpose:
# every release is a deliberate, audited act with an explicit production URL,
# semantic version, and monotonically increasing version code.
#
# It NEVER commits the binary and NEVER deploys it. It uploads one Actions
# artifact containing both release files at their exact deploy paths:
#
#   app/thai-apk.apk            the signed release APK
#   app/thai-apk.manifest.json  generated build evidence (version, commit,
#                               site URL, byte size, SHA-256)
#
# Deploy both files together to the Laravel base path (the paths the
# AndroidApkReleaseService reads). The /app/thai-apk.apk endpoint stays
# fail-closed until the deployed binary matches its manifest.
#
# Protected secrets required:
#   ANDROID_KEYSTORE_BASE64   base64-encoded JKS or PKCS12 keystore bytes
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         release key alias
#   ANDROID_KEY_PASSWORD      release key password (PKCS12: same as keystore)
#
# Never commit a keystore, a password, or a base64 keystore value to Git.

on:
  workflow_dispatch:
    inputs:
      web_app_url:
        description: 'Canonical production HTTPS URL embedded in the app (e.g. https://lottery.example.com)'
        required: true
        type: string
      version_name:
        description: 'Semantic version name (e.g. 1.0.0)'
        required: true
        type: string
      version_code:
        description: 'Monotonically increasing positive integer version code (e.g. 1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and verify release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_APP_URL: ${{ inputs.web_app_url }}
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate the production destination and release version (fail closed)
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          url = os.environ.get("ANDROID_APP_URL", "")
          version = os.environ.get("VERSION_NAME", "")
          code = os.environ.get("VERSION_CODE", "")

          def fail(message: str) -> None:
              print(f"::error::{message}")
              sys.exit(1)

          if "\n" in url or "\r" in url:
              fail("web_app_url cannot contain newline characters.")

          try:
              parts = urlsplit(url)
          except ValueError:
              fail("web_app_url must be a valid absolute HTTPS URL.")

          host = (parts.hostname or "").lower()
          if parts.scheme.lower() != "https":
              fail("web_app_url must use https://. Plain http:// is refused.")
          if not host:
              fail("web_app_url must include a host.")
          if parts.username is not None or parts.password is not None:
              fail("web_app_url must not embed credentials.")
          if parts.query or parts.fragment:
              fail("web_app_url must not include a query string or fragment.")
          if host in {"localhost", "127.0.0.1", "::1"}:
              fail("web_app_url must be a public host, not localhost.")
          if host.endswith(".local") or host.endswith(".internal"):
              fail("web_app_url must not be a .local or .internal host.")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", version):
              fail("version_name must use a semantic version such as 1.0.0.")
          if not re.fullmatch(r"[0-9]+", code) or int(code) < 1:
              fail("version_code must be a positive integer.")

          print(f"Validated destination: {url}")
          print(f"Validated release: version_name={version} version_code={code}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK platform 35 and build tools 35.0.0
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found at $SDKMANAGER on this runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode the release keystore (fail closed without secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. Add the protected release secrets before building."
            exit 1
          fi
          umask 077
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::Decoded keystore is empty. Check the ANDROID_KEYSTORE_BASE64 secret value."
            exit 1
          fi

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD must all be configured."
            exit 1
          fi
          chmod +x android/gradlew
          android/gradlew --no-daemon -p android :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode=$VERSION_CODE

      - name: Verify APK signature, package identity, and label
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected release APK was not produced at $APK."
            exit 1
          fi

          echo "Verifying APK signature with apksigner..."
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

          echo "Verifying package identity and application label with aapt..."
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | head -n 20
          echo "$BADGING" | grep -F "package: name='com.ainul550.thailottery'" >/dev/null \
            || { echo "::error::APK package name is not com.ainul550.thailottery."; exit 1; }
          echo "$BADGING" | grep -F "application-label:'Thai Lottery'" >/dev/null \
            || { echo "::error::APK application label is not 'Thai Lottery'."; exit 1; }

          echo "Verifying archive structure (AndroidManifest.xml + classes dex)..."
          unzip -l "$APK" | grep -F "AndroidManifest.xml" >/dev/null \
            || { echo "::error::APK is missing AndroidManifest.xml."; exit 1; }
          unzip -l "$APK" | grep -E "classes[0-9]*\.dex" >/dev/null \
            || { echo "::error::APK is missing its classes dex entry."; exit 1; }

      - name: Stage release files and generate the build manifest
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          mkdir -p staging/app
          cp "$APK" staging/app/thai-apk.apk

          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os

          apk_path = "staging/app/thai-apk.apk"
          manifest_path = "staging/app/thai-apk.manifest.json"

          with open(apk_path, "rb") as handle:
              digest = hashlib.sha256(handle.read()).hexdigest()
          size_bytes = os.path.getsize(apk_path)
          built_at = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          source_commit = os.environ.get("GITHUB_SHA", "").lower()

          manifest = {
              "status": "VERIFIED",
              "version": os.environ["VERSION_NAME"],
              "package_name": "com.ainul550.thailottery",
              "web_app_url": os.environ["ANDROID_APP_URL"],
              "file": "app/thai-apk.apk",
              "sha256": digest,
              "size_bytes": size_bytes,
              "built_at": built_at,
              "source_commit": source_commit,
          }

          with open(manifest_path, "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, ensure_ascii=False)
              handle.write("\n")

          print(json.dumps(manifest, indent=2))
          PY

          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload the signed APK and its manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-android-apk
          path: staging
          if-no-files-found: error
          retention-days: 30
