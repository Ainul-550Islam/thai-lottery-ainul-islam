name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # intl is required by filament/support (a transitive composer
          # requirement) and by the Filament resource render assertions. It is
          # already present on the runner image; naming it here makes that a
          # declared dependency rather than a lucky default.
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, pdo_mysql, bcmath, sodium, zip, intl, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Activate pinned npm 11.21.1
        run: npm install --global npm@11.21.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Copy controlled CI environment
        run: cp .env.ci .env

      - name: Check the PHP test runtime (extensions and JPEG encoder)
        run: php scripts/check-test-runtime.php

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install and audit front-end dependencies
        run: |
          set -euo pipefail
          npm ci
          npm run test:dependencies
          npm run security:dependencies

      - name: Build front-end assets
        run: npm run build

      - name: Assert the Vite manifest and every registered entry were built
        run: |
          set -euo pipefail
          test -f public/build/manifest.json
          # Every input declared in vite.config.js must have produced an asset.
          # An empty or missing module still "builds", so the manifest is
          # checked entry by entry rather than as a whole.
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("public/build/manifest.json", "utf8"));
            const config = fs.readFileSync("vite.config.js", "utf8");
            const inputs = [...config.matchAll(/["'"'"'](resources\/(?:js|css)\/[^"'"'"']+)["'"'"']/g)].map(m => m[1]);
            let failed = false;
            for (const input of new Set(inputs)) {
              const record = manifest[input];
              if (!record || !record.file || !fs.existsSync("public/build/" + record.file)) {
                console.error("::error::vite entry not built: " + input);
                failed = true;
                continue;
              }
              if (fs.statSync("resources/" + input.slice("resources/".length)).size === 0) {
                console.error("::error::vite entry is an empty file: " + input);
                failed = true;
              }
            }
            process.exit(failed ? 1 : 0);
          '

      - name: PHP syntax check (php -l on all project PHP files)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null; then
              echo "::error file=$f::syntax error"
              fail=1
            fi
          done < <(find app bootstrap config database routes tests -name '*.php' -print0)
          # Required structural files — fail the build if any are missing
          for req in \
            app/Models/User.php \
            app/Models/Agent.php \
            app/Services/Draw/RealPrizeSettlementService.php \
            app/Services/Finance/FinancialReconciliationService.php \
            app/Services/Finance/WithdrawalService.php \
            app/Console/Commands/GloPublicResultPublishCommand.php \
            app/Console/Commands/Finance/ReconcileFinancialRecordsCommand.php \
            app/Filament/Pages/KycReviewPage.php \
            resources/views/filament/pages/kyc-review-page.blade.php \
            resources/views/home.blade.php \
            resources/views/results/index.blade.php \
            routes/api.php \
            routes/web.php \
            config/finance.php \
            .github/workflows/ci.yml
          do
            if [ ! -f "$req" ]; then
              echo "::error::missing required file: $req"
              fail=1
            fi
          done
          # At least one test file and one migration must exist
          if [ -z "$(find tests -name '*Test.php' -print -quit)" ]; then
            echo "::error::no test files found"
            fail=1
          fi
          if [ -z "$(find database/migrations -name '*.php' -print -quit)" ]; then
            echo "::error::no migrations found"
            fail=1
          fi
          exit $fail

      - name: Assert the writable runtime directories are present in the checkout
        run: |
          set -euo pipefail
          fail=0
          # These are the directories Laravel writes to at runtime. Git does not
          # track empty directories, so each one needs its own .gitignore marker
          # to survive a clone. A missing marker only shows up as a confusing
          # "Please provide a valid cache path" much later.
          for dir in \
            bootstrap/cache \
            storage/app/private \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/testing \
            storage/framework/views \
            storage/logs
          do
            if [ ! -d "$dir" ]; then
              echo "::error::missing runtime directory: $dir"
              fail=1
            fi
          done
          exit $fail

      - name: Assert every model with HasFactory has a factory
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' model; do
            name="$(basename "$model" .php)"
            # An abstract model cannot be instantiated, so it can have no factory
            # of its own (app/Models/Support/Abstract*). Its concrete subclasses
            # are the ones that need one.
            if grep -qE '^[[:space:]]*abstract[[:space:]]+class[[:space:]]' "$model"; then
              continue
            fi
            if grep -q 'HasFactory' "$model" && [ ! -f "database/factories/${name}Factory.php" ]; then
              echo "::error file=$model::model declares HasFactory but database/factories/${name}Factory.php is missing"
              fail=1
            fi
          done < <(find app/Models -name '*.php' -print0)
          exit $fail

      - name: Application key and route optimisation
        run: |
          set -euo pipefail
          php artisan key:generate --force
          php artisan optimize:clear
          php artisan config:cache
          # Fail if config:cache did not produce a bootstrap cache
          test -f bootstrap/cache/config.php

      - name: Migrate fresh with seed
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/ci-migrate.sqlite
        run: |
          touch "$DB_DATABASE"
          php artisan config:clear
          php artisan migrate:fresh --force --seed

      - name: Route list (contract smoke)
        run: |
          php artisan route:list
          php artisan route:list --path=/
          php artisan route:list --path=results

      # ManifestSanityTest renders the Helm chart, so the lane needs a real helm
      # binary. The tarball is verified against a pinned SHA-256 before it is
      # unpacked; a mismatch fails the job instead of running an unknown binary.
      - name: Install checksum-verified Helm v3.19.4
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output /tmp/helm-v3.19.4-linux-amd64.tar.gz \
            https://get.helm.sh/helm-v3.19.4-linux-amd64.tar.gz
          echo "759c656fbd9c11e6a47784ecbeac6ad1eb16a9e76d202e51163ab78504848862  /tmp/helm-v3.19.4-linux-amd64.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/helm"
          tar -xzf /tmp/helm-v3.19.4-linux-amd64.tar.gz -C "$RUNNER_TEMP/helm" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"

      # WeeklyNativeVerifierRuntimeTest asserts the real executable exists; it
      # must be built before the suite, never skipped when it is missing.
      - name: Build the native Weekly integrity verifier
        run: bash scripts/build-weekly-native-verifier.sh

      - name: Run the SQLite PHP lane (every case routed, none skipped)
        env:
          APP_ENV: testing
        run: |
          set -euo pipefail
          # A cached config file wins over phpunit.xml's <env> overrides, which
          # points the suite at the development database and connection instead
          # of the in-memory test one. The cache is proven above and discarded
          # here, before the suite runs.
          php artisan config:clear
          test ! -f bootstrap/cache/config.php
          # Skips, risky tests, incomplete tests and an empty suite are failures,
          # and the lane runner reconciles JUnit against its own discovery plan.
          python3 scripts/run_php_test_lane.py --lane sqlite --output evidence/php-suite/sqlite

      - name: Upload SQLite PHP case census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-case-census-sqlite
          path: evidence/php-suite/sqlite
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------------
      # PROMPT 7: the seams between a result lane and the rest of the repo.
      #
      # The full suite above already runs these tests. This step exists
      # because a seam failure is a DIFFERENT KIND of failure: the lane works,
      # every unit passes, and the feature is still unreachable or its
      # configuration undocumented. Naming the contract here means the CI log
      # says which agreement broke instead of just "a test failed".
      #
      # Cheap greps first, so an obvious breach fails in a second rather than
      # after the whole suite.
      # ---------------------------------------------------------------------
      - name: Assert the result-lane seams are closed
        run: |
          set -euo pipefail

          echo "--- robots.txt: search blocked, content crawlable ---"
          test -f public/robots.txt
          for lane in national-lottery weekly-lottery bingo-lottery pcso-lottery; do
            grep -qx "Disallow: /${lane}/search" public/robots.txt \
              || { echo "::error::robots.txt does not block /${lane}/search"; exit 1; }
            # A bare prefix rule would deindex the entire lane.
            if grep -qE "^Disallow:[[:space:]]*/${lane}/?[[:space:]]*$" public/robots.txt; then
              echo "::error::robots.txt blocks the whole ${lane} lane, not just its search route"
              exit 1
            fi
            if grep -qE "^Disallow:[[:space:]]*/${lane}/year" public/robots.txt; then
              echo "::error::robots.txt blocks the ${lane} year archive"
              exit 1
            fi
          done

          echo "--- .env.example documents every key each lane config reads ---"
          node -e '
            const fs = require("fs");
            const example = fs.readFileSync(".env.example", "utf8");
            let failed = false;
            for (const lane of ["national_lottery", "weekly_lottery", "bingo_lottery", "pcso_lottery", "contact"]) {
              const config = fs.readFileSync("config/" + lane + ".php", "utf8");
              const prefix = lane === "contact" ? "CONTACT" : lane.toUpperCase();
              const keys = new Set(
                [...config.matchAll(new RegExp("env\\(\\s*[\x27\"](" + prefix + "_[A-Z0-9_]+)[\x27\"]", "g"))]
                  .map(m => m[1])
              );
              if (keys.size === 0) {
                console.error("::error::no env keys parsed out of config/" + lane + ".php");
                failed = true;
                continue;
              }
              for (const key of keys) {
                // A commented-out entry counts: credentials are named but valueless.
                if (!new RegExp("^#?\\s*" + key + "=", "m").test(example)) {
                  console.error("::error::" + key + " is read by config/" + lane + ".php but undocumented in .env.example");
                  failed = true;
                }
                // A credential must never ship with a value.
                if (/(TOKEN|SECRET|KEY)$/.test(key) && new RegExp("^" + key + "=.+", "m").test(example)) {
                  console.error("::error::" + key + " has a value in .env.example");
                  failed = true;
                }
              }
            }
            process.exit(failed ? 1 : 0);
          '

          echo "--- /contact must stay crawlable ---"
          if grep -qE "^Disallow:[[:space:]]*/contact" public/robots.txt; then
            echo "::error::robots.txt blocks /contact, which is ordinary public content"
            exit 1
          fi

          echo "--- no competitor string in any public surface ---"
          # The reference pages that motivated these lanes may be named in
          # audit notes and prompts. They must never appear in anything that
          # ships. Scoped to production source so a research note in a report
          # file does not fail the build.
          #
          # "thailotto" alone cannot be the needle: it is this product's own
          # brand (manifest short_name, thailotto-theme.css, lang/*/home.php,
          # ...), so that check could never pass. The needles are the
          # third-party identifiers instead.
          if grep -rniE "glothai\.com|myaccount\.thailotto" \
               app config routes lang public database \
               resources/views resources/css resources/js \
               2>/dev/null | grep -v "^resources/views/vendor/"; then
            echo "::error::a competitor reference reached production source"
            exit 1
          fi

          echo "--- guest navigation links both public lanes ---"
          # layouts/app.blade.php only renders <x-navigation.main-nav />; the
          # links themselves live in that component.
          for name in national-lottery.index weekly-lottery.index bingo-lottery.index pcso-lottery.index contact; do
            grep -q "route('${name}')" resources/views/components/navigation/main-nav.blade.php \
              || { echo "::error::guest navigation has no link to ${name}"; exit 1; }
          done

          echo "Seam contracts hold."

      - name: Seam and lane test suites (named, so a failure says which)
        env:
          APP_ENV: testing
        run: |
          set -euo pipefail
          php artisan test \
            --filter='NationalLotteryIntegrationSeamTest|NationalLotteryPublicPageTest|WeeklyLotteryPublicPageTest|BingoLotteryPublicPageTest|PcsoLotteryPublicPageTest|ContactPageTest'

      - name: Pint (if configured)
        run: |
          if [ -f vendor/bin/pint ]; then
            vendor/bin/pint --test
          else
            echo "Pint not installed — skipping style gate"
          fi

  # ---------------------------------------------------------------------------
  # PROMPT 6: the Weekly Lottery integrity crate.
  #
  # A SEPARATE JOB, not extra steps on the PHP job, for two reasons. It needs a
  # Rust toolchain the PHP job has no use for, and the two must be able to fail
  # independently: a broken canonicalizer and a broken Blade template are
  # different problems and should not hide behind one red cross.
  #
  # --locked everywhere. The lock file is committed, and a CI run that silently
  # resolved a different dependency tree would not be testing what ships - which
  # matters more than usual for a component whose whole job is producing a
  # deterministic hash.
  # ---------------------------------------------------------------------------
  rust-integrity:
    name: Rust integrity verifier
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: security/weekly-result-integrity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            security/weekly-result-integrity/target
          key: cargo-${{ runner.os }}-${{ hashFiles('security/weekly-result-integrity/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --check

      - name: Type check
        run: cargo check --locked --all-targets

      - name: Tests
        run: cargo test --locked

      - name: Assert the crate cannot reach the network or a database
        run: |
          set -euo pipefail
          # The "no network" property is enforced by ABSENCE of any such
          # dependency. tests/integrity.rs already asserts this against
          # Cargo.lock; this repeats it against the RESOLVED tree so a
          # transitive addition cannot slip in behind a direct one.
          tree=$(cargo tree --locked --edges normal --prefix none)
          for crate in tokio reqwest hyper curl ureq socket2 mio rustls native-tls sqlx diesel postgres tokio-postgres; do
            if printf '%s\n' "$tree" | grep -qE "^${crate} v"; then
              echo "::error::forbidden dependency in the integrity crate: ${crate}"
              exit 1
            fi
          done
          echo "No networking or database crate is present."

      - name: Release build (the binary Laravel invokes)
        run: cargo build --release --locked

      - name: Smoke test the stdin/stdout contract
        run: |
          set -euo pipefail
          # Leading zeros must survive, and a malformed value must be refused
          # with exit code 2 rather than repaired.
          ok=$(printf '%s' '{"draw_reference":"WK-20260918","draw_date":"2026-09-18","first_6":"001234","three_ball":"049","two_ball":"09","source_identifier":"CI","parser_version":"1"}' \
            | ./target/release/weekly-result-integrity)
          echo "$ok"
          printf '%s\n' "$ok" | grep -q '"status":"INTEGRITY_HASH_ONLY"'
          printf '%s\n' "$ok" | grep -q '"acceptable":true'

          set +e
          printf '%s' '{"draw_reference":"WK-20260918","draw_date":"2026-09-18","first_6":"1234","parser_version":"1"}' \
            | ./target/release/weekly-result-integrity
          code=$?
          set -e
          test "$code" -eq 2
          echo "Malformed payload refused with exit code 2."

  runtime-and-rust-contracts:
    name: Runtime and Rust contract gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, pdo_mysql, bcmath, sodium, zip, intl, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Activate pinned npm 11.21.1
        run: npm install --global npm@11.21.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Copy controlled CI environment
        run: cp .env.ci .env

      - name: Validate Composer platform and dependencies
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress
          composer check-platform-reqs
          composer audit --locked --abandoned=fail --no-interaction

      # After composer install on purpose: artisan loads vendor/autoload.php.
      - name: Generate the CI application key
        run: php artisan key:generate --force

      - name: Install and audit frontend dependencies
        run: |
          set -euo pipefail
          npm ci
          npm run test:dependencies
          npm run security:dependencies
          npm run build

      - name: Verify Rust integrity crate
        working-directory: security/weekly-result-integrity
        run: |
          set -euo pipefail
          cargo check --locked
          cargo test --locked
          cargo build --release --locked

      - name: Build the native Weekly integrity verifier
        run: bash scripts/build-weekly-native-verifier.sh

      # The PHP side is exercised against the real executable built above, with
      # no skip guard and no faked process.
      - name: Native verifier PHP-to-Rust contract
        run: |
          set -euo pipefail
          php artisan test \
            tests/Feature/WeeklyLottery/WeeklyNativeVerifierRuntimeTest.php \
            tests/Feature/WeeklyLottery/WeeklyLotteryPublicPageTest.php \
            --fail-on-skipped --fail-on-incomplete --fail-on-empty-test-suite

  full-runtime-release:
    name: Full runtime release candidate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: thai_lottery_test
          MYSQL_USER: thailotto_ci
          MYSQL_PASSWORD: ci_database_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: thai_lottery_test
      DB_USERNAME: thailotto_ci
      DB_PASSWORD: ci_database_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: array
      MAIL_MAILER: log
      PAGES_451_550_DESTRUCTIVE_TESTS: '1'
      # The MySQL lane runs the live settlement worker fixture and the
      # independent-engine concurrency fixture; neither may be skipped.
      SETTLEMENT_WORKER_LIVE_TEST: '1'
      SETTLEMENT_WORKER_LIVE_URL: http://127.0.0.1:9101
      CONCURRENCY_TEST_ALLOW_DESTRUCTIVE: '1'
      CONCURRENCY_TEST_DSN: mysql://concurrency_test:ci_concurrency_password@127.0.0.1:3306/thai_lottery_conc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, mysqlnd, pdo_mysql, bcmath, sodium, zip, intl, redis, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Activate pinned npm 11.21.1
        run: npm install --global npm@11.21.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install database client and socket proxy
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mysql-client socat

      - name: Copy controlled CI environment
        run: cp .env.ci .env

      - name: Install and verify Composer dependencies
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress
          composer check-platform-reqs
          composer audit --locked --abandoned=fail --no-interaction
          composer dump-autoload --optimize

      # After composer install on purpose: artisan loads vendor/autoload.php,
      # so key:generate before the install dies with exit 255.
      - name: Prepare controlled Laravel environment
        run: |
          set -euo pipefail
          php artisan key:generate --force

      - name: Install, audit, and build frontend
        run: |
          set -euo pipefail
          npm ci
          npm run test:dependencies
          npm run security:dependencies
          npm run build

      - name: Boot, cache, route, and view gates
        run: |
          set -euo pipefail
          php artisan about
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:list
          php artisan route:cache
          php artisan view:cache

      - name: Controlled schema, seed, and migration gates
        run: |
          set -euo pipefail
          php artisan migrate:status || echo "no migrations table yet (fresh database)"
          php artisan migrate:fresh --force
          php artisan db:seed --force
          php artisan migrate:status

      - name: Install Redis client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-tools

      - name: Controlled queue and scheduler gates
        run: |
          set -euo pipefail
          redis-cli ping
          php artisan queue:failed
          php artisan schedule:list

      # WeeklyNativeVerifierRuntimeTest asserts the real executable exists.
      - name: Build the native Weekly integrity verifier
        run: bash scripts/build-weekly-native-verifier.sh

      # Trigger and routine creation under binary logging needs SUPER unless the
      # server trusts function creators. Setting the global flag as root keeps
      # SUPER off the application user, and the read-back proves it took effect.
      - name: Allow real failure injection without granting SUPER
        run: |
          set -euo pipefail
          docker exec -e MYSQL_PWD=ci_root_password ${{ job.services.mysql.id }} \
            mysql --user=root -e "SET GLOBAL log_bin_trust_function_creators=1"
          value="$(docker exec -e MYSQL_PWD=ci_root_password ${{ job.services.mysql.id }} \
            mysql --user=root --batch --skip-column-names \
            -e "SELECT @@GLOBAL.log_bin_trust_function_creators")"
          test "$value" = 1

      # The row-lock tests observe real InnoDB locks, which needs read access to
      # the lock tables and PROCESS. Nothing broader is granted.
      - name: Grant scoped lock-observation privileges
        run: |
          set -euo pipefail
          docker exec -e MYSQL_PWD=ci_root_password ${{ job.services.mysql.id }} \
            mysql --user=root -e "GRANT SELECT ON performance_schema.data_locks TO 'thailotto_ci'@'%'; GRANT SELECT ON performance_schema.data_lock_waits TO 'thailotto_ci'@'%'; GRANT SELECT ON performance_schema.threads TO 'thailotto_ci'@'%'; GRANT PROCESS ON *.* TO 'thailotto_ci'@'%';"

      # The lane runner refuses to start without a LOCAL SERVER SOCKET. The
      # service container only publishes TCP, so a local socat listener forwards
      # a unix socket to it, and the step proves a client can use that socket.
      - name: Provision the local MySQL test-server socket
        run: |
          set -euo pipefail
          socket="$RUNNER_TEMP/mysql-test/mysqld.sock"
          mkdir -p "$(dirname "$socket")"
          nohup socat "UNIX-LISTEN:$socket,fork,reuseaddr,unlink-early,mode=0600" TCP:127.0.0.1:3306 >/tmp/mysql-socket-proxy.log 2>&1 &
          for _ in $(seq 1 30); do
            test -S "$socket" && break
            sleep 1
          done
          test -S "$socket"
          MYSQL_PWD=ci_database_password mysql --protocol=SOCKET --socket="$socket" --user=thailotto_ci -e "SELECT 1" thai_lottery_test
          echo "DB_SOCKET=$socket" >> "$GITHUB_ENV"

      # Disposable schemas and scoped users for the two destructive fixtures. The
      # worker user may only read thai_lottery_test; each fixture user owns
      # exactly one throwaway schema.
      - name: Build and start the live settlement worker
        run: |
          set -euo pipefail
          docker exec -e MYSQL_PWD=ci_root_password ${{ job.services.mysql.id }} \
            mysql --user=root -e "CREATE DATABASE settlement_worker_destructive_test; CREATE USER 'settlement_worker_test'@'%' IDENTIFIED BY 'ci_settlement_worker_password'; GRANT ALL PRIVILEGES ON settlement_worker_destructive_test.* TO 'settlement_worker_test'@'%'; GRANT SELECT ON thai_lottery_test.* TO 'settlement_worker_test'@'%'; CREATE DATABASE thai_lottery_conc; CREATE USER 'concurrency_test'@'%' IDENTIFIED WITH mysql_native_password BY 'ci_concurrency_password'; GRANT ALL PRIVILEGES ON thai_lottery_conc.* TO 'concurrency_test'@'%';"

          # Every ignored (real-database) worker test runs; a skipped one fails.
          MYSQL_TEST_ALLOW_DESTRUCTIVE=1 \
          MYSQL_TEST_URL=mysql://settlement_worker_test:ci_settlement_worker_password@127.0.0.1:3306/settlement_worker_destructive_test \
            cargo test --locked --manifest-path runtime/settlement-worker/Cargo.toml -- --include-ignored 2>&1 | tee /tmp/settlement-worker-cargo-test.log
          grep -F '0 failed; 0 ignored;' /tmp/settlement-worker-cargo-test.log

          cargo build --locked --release --manifest-path runtime/settlement-worker/Cargo.toml
          worker=runtime/settlement-worker/target/release/settlement-worker
          DATABASE_URL=mysql://settlement_worker_test:ci_settlement_worker_password@127.0.0.1:3306/thai_lottery_test \
          SETTLEMENT_WORKER_HMAC_SECRET=live-settlement-worker-integration-secret-32 \
          WORKER_BIND=127.0.0.1:9101 \
            nohup "$worker" >/tmp/settlement-worker.log 2>&1 &
          for _ in $(seq 1 30); do
            WORKER_BIND=127.0.0.1:9101 "$worker" --healthcheck && break
            sleep 1
          done
          WORKER_BIND=127.0.0.1:9101 runtime/settlement-worker/target/release/settlement-worker --healthcheck

      - name: Preflight the real-engine login the way the test connects
        run: |
          if ! php -r '$p = new PDO("mysql:unix_socket=" . getenv("DB_SOCKET") . ";dbname=thai_lottery_conc", "concurrency_test", "ci_concurrency_password"); echo "concurrency_test login ok\n";'; then
            docker exec -e MYSQL_PWD=ci_root_password ${{ job.services.mysql.id }} \
              mysql --user=root -e "SELECT user, host, plugin FROM mysql.user WHERE user = 'concurrency_test'"
            exit 1
          fi
      - name: Run the MySQL PHP lane (native, live-worker and real-engine cases)
        run: |
          set -euo pipefail
          # Cached config/routes/views from the boot gates must not leak into the suite.
          php artisan optimize:clear
          python3 scripts/run_php_test_lane.py --lane mysql --output evidence/php-suite/mysql

      - name: Upload MySQL PHP case census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-case-census-mysql
          path: evidence/php-suite/mysql
          if-no-files-found: error
          retention-days: 14

      - name: Start application and run public browser smoke tests
        run: |
          set -euo pipefail
          nohup php artisan serve --host=0.0.0.0 --port=8000 >/tmp/laravel-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/up/live
          npx playwright install --with-deps chromium
          npm run e2e:public

      - name: Backup, restore, and compare controlled database
        env:
          MYSQL_PWD: ci_database_password
        run: |
          set -euo pipefail
          # The restore database is created and granted by root; the application
          # user never gets CREATE on the server.
          docker exec -e MYSQL_PWD=ci_root_password ${{ job.services.mysql.id }} \
            mysql --user=root -e "CREATE DATABASE thailotto_restore; GRANT ALL PRIVILEGES ON thailotto_restore.* TO 'thailotto_ci'@'%';"

          mysqldump --host=127.0.0.1 --port=3306 --user=thailotto_ci \
            --no-tablespaces --single-transaction --routines --events \
            thai_lottery_test > /tmp/thailotto-test.sql
          sha256sum /tmp/thailotto-test.sql | tee /tmp/thailotto-test.sql.sha256
          test -s /tmp/thailotto-test.sql
          mysql --host=127.0.0.1 --port=3306 --user=thailotto_ci thailotto_restore < /tmp/thailotto-test.sql
          DB_DATABASE=thailotto_restore php artisan migrate:status

          # Data bytes: ordered, data-only dumps of both databases must be identical.
          for database in thai_lottery_test thailotto_restore; do
            mysqldump --host=127.0.0.1 --port=3306 --user=thailotto_ci \
              --no-tablespaces --single-transaction --no-create-info --skip-triggers \
              --skip-comments --hex-blob --order-by-primary \
              "$database" > "/tmp/${database}.rows.sql"
            mysql --host=127.0.0.1 --port=3306 --user=thailotto_ci --batch --raw --skip-column-names \
              "$database" < scripts/mysql-roundtrip-fingerprint.sql > "/tmp/${database}.schema.txt"
          done
          cmp /tmp/thai_lottery_test.rows.sql /tmp/thailotto_restore.rows.sql
          cmp /tmp/thai_lottery_test.schema.txt /tmp/thailotto_restore.schema.txt

      - name: Rust integrity gates
        working-directory: security/weekly-result-integrity
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo check --locked --all-targets
          cargo test --locked
          cargo build --release --locked

      - name: Final source hygiene gate
        run: |
          set -euo pipefail
          git diff --check

  # ---------------------------------------------------------------------------
  # Every PHPUnit case is routed to exactly one lane (SQLite or MySQL). Neither
  # job can pass by quietly dropping the cases that belong to the other, so this
  # job reconciles both discovery plans and both JUnit sets from the same commit.
  # ---------------------------------------------------------------------------
  php-case-census:
    name: PHP case census
    runs-on: ubuntu-latest
    needs: [test, full-runtime-release]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SQLite lane census
        uses: actions/download-artifact@v4
        with:
          name: php-case-census-sqlite
          path: evidence/php-suite/sqlite

      - name: Download MySQL lane census
        uses: actions/download-artifact@v4
        with:
          name: php-case-census-mysql
          path: evidence/php-suite/mysql

      - name: Reconcile the lanes
        run: python3 scripts/run_php_test_lane.py --reconcile evidence/php-suite/sqlite evidence/php-suite/mysql

      - name: Require both lane jobs to have passed
        env:
          SQLITE_JOB_RESULT: ${{ needs.test.result }}
          MYSQL_JOB_RESULT: ${{ needs.full-runtime-release.result }}
        run: |
          set -euo pipefail
          test "$SQLITE_JOB_RESULT" = success
          test "$MYSQL_JOB_RESULT" = success
