version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: fintech_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - .:/var/www/html:ro
    depends_on:
      - app-node-1
      - app-node-2
      - reverb
    networks:
      - fintech_net

  app-node-1:
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
    container_name: fintech_app_1
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - .:/var/www/html
    networks:
      - fintech_net

  app-node-2:
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
    container_name: fintech_app_2
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - .:/var/www/html
    networks:
      - fintech_net

  horizon-worker:
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
    container_name: fintech_horizon
    restart: always
    command: php artisan horizon
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: redis
    volumes:
      - .:/var/www/html
    depends_on:
      - redis
      - mysql-primary
    networks:
      - fintech_net

  reverb:
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
    container_name: fintech_reverb
    restart: always
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: production
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    volumes:
      - .:/var/www/html
    depends_on:
      - redis
    networks:
      - fintech_net

  redis:
    image: redis:7-alpine
    container_name: fintech_redis
    restart: always
    command: redis-server --appendonly yes --requirepass "SecureClusterRedisPass2026!" --maxmemory 4gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fintech_net

  mysql-primary:
    image: mysql:8.0
    container_name: fintech_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "RootSuperSecurePass2026!"
      MYSQL_DATABASE: "thai_lottery_enterprise"
      MYSQL_USER: "fintech_user"
      MYSQL_PASSWORD: "FintechUserPass2026!"
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=8G
      --innodb-log-file-size=1G
      --innodb-flush-log-at-trx-commit=1
      --innodb-flush-method=O_DIRECT
      --max-connections=2000
      --transaction-isolation=READ-COMMITTED
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fintech_net

networks:
  fintech_net:
    driver: bridge

volumes:
  redis_data:
  mysql_data:
