# Production Compose topology for the MySQL/MariaDB Laravel application.
# Secrets are mounted from the external secret store; non-secret overrides are
# supplied by the operator-provided .env.production file.

name: thai-lottery

x-app-image: &app-image
  image: ghcr.io/ainul-550islam/thai-lottery-app:${APP_IMAGE_TAG:?APP_IMAGE_TAG must be an immutable release tag}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: runtime
    args:
      PHP_VERSION: "8.4"
      BASE_DIGEST: "${PHP_BASE_DIGEST:?PHP_BASE_DIGEST must be supplied}"
      NODE_VERSION: "24.22.0"
      NPM_VERSION: "11.21.1"

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  APP_URL: "https://${APP_HOST:?APP_HOST must be supplied}"
  APP_KEY_FILE: /run/secrets/app_key
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_PASSWORD_FILE: /run/secrets/db_password
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb
  SESSION_SECURE_COOKIE: "true"
  SESSION_ENCRYPT: "true"

x-app-depends: &app-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:

  # ───────────────────────────────────────────────────────────────────────────
  # Database
  # ───────────────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    command: >
      --innodb-buffer-pool-size=2G
      --innodb-flush-log-at-trx-commit=1
      --innodb-lock-wait-timeout=15
      --transaction-isolation=READ-COMMITTED
      --group-concat-max-len=1048576
      --max-connections=500
      --slow-query-log=1
      --long-query-time=1
    volumes:
      - db-data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /var/run/mysqld:rw,noexec,nosuid,size=64m
    cpus: 4.0
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Redis — cache, locks, queues, sessions
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 1gb --maxmemory-policy noeviction --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    secrets:
      - redis_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cpus: 1.0
    mem_limit: 1536m
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Migrations — one-shot, must complete before the app starts
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    env_file:
      - .env.production
    <<: *app-image
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cpus: 2.0
    mem_limit: 2g
    environment:
      <<: *app-env
    command: >
      sh -c "php artisan migrate --force --isolated &&
             php artisan config:cache &&
             php artisan route:cache &&
             php artisan view:cache &&
             php artisan event:cache"
    secrets: [app_key, db_password, redis_password]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Application — PHP-FPM
  # ───────────────────────────────────────────────────────────────────────────
  app:
    env_file:
      - .env.production
    <<: *app-image
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cpus: 2.0
    mem_limit: 2g
    environment:
      <<: *app-env
      SETTLEMENT_WORKER_ENABLED: "${SETTLEMENT_WORKER_ENABLED:-true}"
      SETTLEMENT_WORKER_URL: "http://settlement-worker:9101"
      SETTLEMENT_WORKER_HMAC_SECRET_FILE: /run/secrets/settlement_worker_hmac_secret
    secrets: [app_key, db_password, redis_password, settlement_worker_hmac_secret]
    depends_on:
      <<: *app-depends
      settlement-worker:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [backend, provider-egress]

  # ───────────────────────────────────────────────────────────────────────────
  # Nginx — the only service exposed to the internet
  # ───────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/cache/nginx:rw,noexec,nosuid,size=128m
      - /var/run:rw,noexec,nosuid,size=16m
    cpus: 2.0
    mem_limit: 1g
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/conf.d/app.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/snippets/websocket.conf:/etc/nginx/snippets/websocket.conf:ro
      - ./public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [backend, edge]

  # ───────────────────────────────────────────────────────────────────────────
  # Horizon — queue workers (replaces the single supervisord worker)
  # ───────────────────────────────────────────────────────────────────────────
  horizon:
    env_file:
      - .env.production
    <<: *app-image
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cpus: 2.0
    mem_limit: 2g
    environment:
      <<: *app-env
      SETTLEMENT_WORKER_ENABLED: "${SETTLEMENT_WORKER_ENABLED:-true}"
      SETTLEMENT_WORKER_URL: "http://settlement-worker:9101"
      SETTLEMENT_WORKER_HMAC_SECRET_FILE: /run/secrets/settlement_worker_hmac_secret
    command: ["php", "artisan", "horizon"]
    secrets: [app_key, db_password, redis_password, settlement_worker_hmac_secret]
    depends_on:
      <<: *app-depends
      settlement-worker:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
    # Horizon's own auto-restart on memory/time limits is configured in
    # config/horizon.php. `restart: unless-stopped` covers the process itself.
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [backend, provider-egress]

  # ───────────────────────────────────────────────────────────────────────────
  # Scheduler — EXACTLY ONE replica. Two schedulers double-fire every task.
  # ───────────────────────────────────────────────────────────────────────────
  scheduler:
    env_file:
      - .env.production
    <<: *app-image
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cpus: 2.0
    mem_limit: 2g
    environment:
      <<: *app-env
    command: ["php", "artisan", "schedule:work"]
    secrets: [app_key, db_password, redis_password]
    depends_on: *app-depends
    volumes:
      - app-storage:/var/www/html/storage
    # Do NOT scale this service.
    healthcheck:
      test: ["CMD", "php", "artisan", "schedule:list"]
      interval: 60s
      timeout: 15s
      retries: 2
    deploy:
      replicas: 1
    networks: [backend, provider-egress]

  # ───────────────────────────────────────────────────────────────────────────
  # Reverb — WebSocket server. Without it, every one of the seven
  # ShouldBroadcast events in app/Events/ writes to a log file and no client
  # ever receives a result push.
  # ───────────────────────────────────────────────────────────────────────────
  reverb:
    env_file:
      - .env.production
    <<: *app-image
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cpus: 2.0
    mem_limit: 2g
    environment:
      <<: *app-env
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen(\\\"127.0.0.1\\\", 8080) ? 0 : 1);\""]
      interval: 15s
      timeout: 5s
      retries: 3
    secrets: [app_key, db_password, redis_password]
    depends_on: *app-depends
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Rust settlement worker — the hot path
  # ───────────────────────────────────────────────────────────────────────────
  settlement-worker:
    image: ghcr.io/ainul-550islam/thai-lottery-settlement-worker:${APP_IMAGE_TAG:?APP_IMAGE_TAG must be an immutable release tag}
    build:
      context: .
      dockerfile: docker/rust/Dockerfile
    restart: unless-stopped
    read_only: true
    environment:
      WORKER_BIND: "0.0.0.0:9101"
      RUST_LOG: "info"
      PRIZE_PAYOUT_SAFETY_MODE: "${PRIZE_PAYOUT_SAFETY_MODE:-DISABLED}"
      DATABASE_URL_FILE: /run/secrets/database_url
      SETTLEMENT_WORKER_HMAC_SECRET_FILE: /run/secrets/settlement_worker_hmac_secret
    secrets: [database_url, settlement_worker_hmac_secret]
    depends_on:
      db:
        condition: service_healthy
    cpus: 2.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/settlement-worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [backend]

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  # Only Laravel request/worker processes use this egress-capable bridge.
  # Restrict its outbound destinations at the Docker host/firewall to the
  # operator-verified provider CIDRs; DB and Redis remain on internal backend.
  provider-egress:
    driver: bridge

volumes:
  db-data:
  redis-data:
  app-storage:

secrets:
  app_key:
    external: true
  redis_password:
    external: true
  db_password:
    external: true
  db_root_password:
    external: true
  database_url:
    external: true
  settlement_worker_hmac_secret:
    external: true
