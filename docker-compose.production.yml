# =============================================================================
# Thai Lottery — production Compose deployment
# =============================================================================
#
# This deployment intentionally uses MySQL, which is the engine configured by
# .env.example and used by the application's MySQL-specific reconciliation SQL.
# CI also runs SQLite; PostgreSQL is not yet an accepted production target.
#
# Non-negotiable deployment prerequisites:
#   * secret files stored outside the repository, with their absolute paths
#     provided as *_SECRET_FILE Compose variables; `redis_acl` must define the
#     Redis default user with the same password as `redis_password`;
#   * DB_DATABASE, DB_USERNAME and APP_URL set in the Compose environment;
#   * TLS certificate contents provisioned out-of-band and rotated safely;
#   * persistent, backed-up Docker volumes for MySQL, Redis and application data.
#
# This file does not start Horizon or Reverb because neither package is present
# in composer.lock. It uses Laravel's built-in queue:work and the log broadcast
# driver. The Rust worker is intentionally not deployed here: it requires
# PostgreSQL, whereas this application and this Compose stack use MySQL, and PHP
# does not dispatch to that worker. Enabling either service before integrating
# and testing its actual driver would create a misleading, nonfunctional lane.
#
# MYSQL GROUP_CONCAT
# MySQL silently truncates GROUP_CONCAT at 1024 bytes by default. The app uses
# GROUP_CONCAT in reconciliation queries, so this server setting raises that
# limit to 1 MiB. This is a mitigation, not a substitute for replacing those
# queries with bounded, typed aggregation and testing that change.
# =============================================================================

name: thai-lottery

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: runtime
    args:
      PHP_VERSION: "8.4"

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: "${APP_URL:?APP_URL is required}"
  APP_TIMEZONE: Asia/Bangkok
  APP_KEY_FILE: /run/secrets/app_key
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
  DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
  DB_PASSWORD_FILE: /run/secrets/db_password
  DB_CHARSET: utf8mb4
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  # Laravel Reverb is unavailable until the package is installed and locked.
  BROADCAST_CONNECTION: log
  SESSION_SECURE_COOKIE: "true"
  SESSION_ENCRYPT: "true"

x-app-secrets: &app-secrets
  - app_key
  - db_password
  - redis_password

x-app-depends: &app-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    command:
      - --innodb-buffer-pool-size=2G
      - --innodb-flush-log-at-trx-commit=1
      - --innodb-lock-wait-timeout=15
      - --transaction-isolation=READ-COMMITTED
      - --group-concat-max-len=1048576
      - --max-connections=500
      - --slow-query-log=1
      - --long-query-time=1
    volumes:
      - db-data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
      - --aclfile
      - /run/secrets/redis_acl
    volumes:
      - redis-data:/data
    secrets:
      - redis_password
      - redis_acl
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  migrate:
    <<: *app-image
    restart: "no"
    environment:
      <<: *app-env
    command:
      - php
      - artisan
      - migrate
      - --force
      - --isolated
    secrets: *app-secrets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  app:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-env
    secrets: *app-secrets
    depends_on: *app-depends
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - backend
      - egress

  worker:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-env
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=settlement,payouts,webhooks,notifications,default
      - --sleep=1
      - --tries=3
      - --timeout=120
      - --max-time=3600
    secrets: *app-secrets
    depends_on: *app-depends
    volumes:
      - app-storage:/var/www/html/storage
    stop_grace_period: 120s
    networks:
      - backend
      - egress

  scheduler:
    <<: *app-image
    container_name: thai-lottery-scheduler
    restart: unless-stopped
    environment:
      <<: *app-env
    command: ["php", "artisan", "schedule:work"]
    secrets: *app-secrets
    depends_on: *app-depends
    volumes:
      - app-storage:/var/www/html/storage
    # The explicit name prevents Compose from scaling this service to multiple
    # replicas. The scheduler must remain a single instance.
    deploy:
      replicas: 1
    networks:
      - backend
      - egress

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro
    secrets:
      - tls_certificate
      - tls_private_key
    depends_on:
      - app
    networks:
      - edge
      - backend

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  db-data:
  redis-data:
  app-storage:

secrets:
  app_key:
    file: ${APP_KEY_SECRET_FILE:?APP_KEY_SECRET_FILE is required}
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:?DB_PASSWORD_SECRET_FILE is required}
  db_root_password:
    file: ${DB_ROOT_PASSWORD_SECRET_FILE:?DB_ROOT_PASSWORD_SECRET_FILE is required}
  redis_password:
    file: ${REDIS_PASSWORD_SECRET_FILE:?REDIS_PASSWORD_SECRET_FILE is required}
  redis_acl:
    file: ${REDIS_ACL_SECRET_FILE:?REDIS_ACL_SECRET_FILE is required}
  tls_certificate:
    file: ${TLS_CERTIFICATE_SECRET_FILE:?TLS_CERTIFICATE_SECRET_FILE is required}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_SECRET_FILE:?TLS_PRIVATE_KEY_SECRET_FILE is required}
