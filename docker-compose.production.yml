# Thai Lottery — production Docker Compose stack.
#
# Default profile: db, redis, migrate, app, nginx, scheduler.
# Opt-in profiles: --profile horizon, --profile reverb, --profile settlement-worker.
# The Rust settlement-worker is PostgreSQL-only; enable only with a Postgres endpoint.

name: thai-lottery

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: runtime
    args:
      PHP_VERSION: "8.4"
      NODE_VERSION: "22"

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_CLIENT: phpredis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_SECURE_COOKIE: "true"
  SESSION_ENCRYPT: "true"
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: log
  ASSET_EXPORT_DIR: /var/www/assets/public/build

x-app-secrets: &app-secrets
  - app_key
  - db_password
  - redis_password

x-app-depends: &app-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    command: >
      --innodb-buffer-pool-size=2G
      --innodb-flush-log-at-trx-commit=1
      --innodb-lock-wait-timeout=15
      --transaction-isolation=READ-COMMITTED
      --group-concat-max-len=1048576
      --max-connections=500
      --slow-query-log=1
      --long-query-time=1
    volumes:
      - db-data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password-file=/run/secrets/db_root_password"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [backend]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy noeviction
      --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
      - redis-data:/data
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]

  migrate:
    <<: *app-image
    restart: "no"
    environment:
      <<: *app-env
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      APP_KEY_FILE: /run/secrets/app_key
    command: >
      sh -c "php artisan migrate --force --isolated &&
             php artisan config:cache &&
             php artisan route:cache &&
             php artisan view:cache &&
             php artisan event:cache"
    secrets: *app-secrets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  app:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-env
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      APP_KEY_FILE: /run/secrets/app_key
    secrets: *app-secrets
    depends_on: *app-depends
    volumes:
      - app-storage:/var/www/html/storage
      - public-assets:/var/www/assets/public
    networks: [backend]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - public-assets:/var/www/html/public/build:ro
      - app-storage:/var/www/html/storage:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [backend, edge]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  horizon:
    <<: *app-image
    profiles: ["horizon"]
    restart: unless-stopped
    environment:
      <<: *app-env
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      APP_KEY_FILE: /run/secrets/app_key
    command: ["php", "artisan", "horizon"]
    secrets: *app-secrets
    depends_on: *app-depends
    volumes:
      - app-storage:/var/www/html/storage
    stop_grace_period: 120s
    networks: [backend]

  scheduler:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-env
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      APP_KEY_FILE: /run/secrets/app_key
    command: ["php", "artisan", "schedule:work"]
    secrets: *app-secrets
    depends_on: *app-depends
    volumes:
      - app-storage:/var/www/html/storage
    deploy:
      replicas: 1
    networks: [backend]

  reverb:
    <<: *app-image
    profiles: ["reverb"]
    restart: unless-stopped
    environment:
      <<: *app-env
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      APP_KEY_FILE: /run/secrets/app_key
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    secrets: *app-secrets
    depends_on: *app-depends
    networks: [backend]

  settlement-worker:
    profiles: ["settlement-worker"]
    build:
      context: .
      dockerfile: docker/rust/Dockerfile
    restart: unless-stopped
    environment:
      WORKER_BIND: "0.0.0.0:9101"
      RUST_LOG: "info"
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      - db
    networks: [backend]
    cap_drop: [ALL]

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  db-data:
  redis-data:
  app-storage:
  public-assets:

secrets:
  app_key:
    external: true
  db_password:
    external: true
  db_root_password:
    external: true
  redis_password:
    external: true
  database_url:
    external: true
