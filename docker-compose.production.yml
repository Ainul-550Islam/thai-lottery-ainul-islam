# =============================================================================
# Thai Lottery — production Compose stack
#
# WHAT THIS FILE IS RESPONSIBLE FOR
#   nginx (TLS edge) · app (php-fpm 8.4) · horizon (queue) · scheduler (exactly
#   one) · reverb (websockets) · settlement-worker (Rust) · mysql · redis ·
#   migrate (one-shot) · preflight (one-shot) · backup (optional profile)
#
# HARDENING APPLIED BELOW (and why)
#   read_only root filesystems  A compromised FPM worker cannot rewrite the
#                               application code that the next request will
#                               execute. Writable paths are named explicitly:
#                               storage, bootstrap/cache and a tmpfs /tmp.
#   cap_drop: ALL               PHP-FPM needs no capabilities. The previous file
#                               inherited the default set (NET_RAW, SETUID, …)
#                               which is only useful to an attacker.
#   no-new-privileges          setuid binaries inside the image cannot escalate.
#   non-root uid 10001          matches docker/php/Dockerfile's `USER app`.
#   published ports             only nginx. The database, Redis and Reverb are
#                               on an `internal: true` network with no route off
#                               the host.
#   healthchecks                every service that can hang has one, and the
#                               dependants wait for it (condition:
#                               service_healthy) rather than for "started".
#   logging limits              an unbounded json-file log fills the disk and
#                               takes the database down with it.
#   stop_grace_period           Horizon gets two minutes to finish in-flight
#                               jobs; the previous file gave it ten seconds and
#                               killed payouts mid-transaction.
#
# WHY nginx NO LONGER MOUNTS ./public FROM THE HOST
#   The previous compose mounted the developer's working copy into the web
#   root. The `public/build/manifest.json` it expects is produced by the Vite
#   build *inside the image*, so on a clean host nginx served a directory with
#   no assets at all — a site with no CSS and 404s on every script. nginx now
#   serves the same named volume the app image populates, so the bytes it
#   serves are the bytes that were built and verified.
#
# DATABASE
#   MySQL 8.4, because that is the engine the code and its test suite were
#   written against and CI exercises. config/database.php defaults to pgsql;
#   moving to it is a deliberate, tested project (the raw SQL in
#   FinancialReconciliationService uses MySQL's GROUP_CONCAT). See
#   docs/ops/OPS-RUNBOOK.md. `group_concat_max_len` is raised below because
#   MySQL truncates GROUP_CONCAT silently at 1 KiB, which can make a
#   reconciliation report a discrepancy that does not exist.
#
# SECRETS
#   Every credential is a mounted Docker secret (`*_FILE`) or an environment
#   variable with no default and a `:?` guard. Nothing here carries a usable
#   secret, and no service falls back to a placeholder.
# =============================================================================

name: thai-lottery

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: runtime
    args:
      PHP_VERSION: "8.4"
  image: ${APP_IMAGE:-thai-lottery/app:local}

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  LOG_FORMAT: json
  LOG_REDACT_SENSITIVE: "true"
  APP_KEY_FILE: /run/secrets/app_key
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_PASSWORD_FILE: /run/secrets/db_password
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb
  SESSION_SECURE_COOKIE: "true"
  SESSION_ENCRYPT: "true"
  BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_key
  BACKUP_PATH: /var/www/html/storage/app/backups
  HEALTH_DETAIL_TOKEN_FILE: /run/secrets/health_token

x-app-hardening: &app-hardening
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-app-depends: &app-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-app-volumes: &app-volumes
  - app-storage:/var/www/html/storage
  - app-bootstrap-cache:/var/www/html/bootstrap/cache
  # Populated from the image on first start (Docker copies the image's
  # directory contents into a fresh named volume, ownership included), then
  # mounted read-only into nginx. This is what makes nginx serve the assets that
  # were actually built instead of whatever happens to be in the host checkout.
  - app-public:/var/www/html/public

x-app-secrets: &app-secrets
  - app_key
  - db_password
  - backup_key
  - health_token

services:

  # ───────────────────────────────────────────────────────────────────────────
  # Preflight — proves the release is deployable BEFORE anything migrates.
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    <<: [*app-image, *app-hardening]
    restart: "no"
    environment:
      <<: *app-env
    command: ["php", "artisan", "ops:preflight", "--environment=production"]
    secrets: *app-secrets
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Database
  # ───────────────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    command: >
      --innodb-buffer-pool-size=2G
      --innodb-flush-log-at-trx-commit=1
      --innodb-lock-wait-timeout=15
      --transaction-isolation=READ-COMMITTED
      --group-concat-max-len=1048576
      --max-connections=500
      --slow-query-log=1
      --long-query-time=1
    volumes:
      - db-data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Redis — cache, locks, queues, sessions
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy noeviction
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Migrations — one shot, after preflight, before the application starts
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    <<: [*app-image, *app-hardening]
    restart: "no"
    environment:
      <<: *app-env
    command: >
      sh -c "php artisan migrate --force --isolated &&
             php artisan config:cache &&
             php artisan route:cache &&
             php artisan view:cache &&
             php artisan event:cache"
    secrets: *app-secrets
    volumes: *app-volumes
    depends_on:
      preflight:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Application — php-fpm
  # ───────────────────────────────────────────────────────────────────────────
  app:
    <<: [*app-image, *app-hardening]
    restart: unless-stopped
    environment:
      <<: *app-env
    secrets: *app-secrets
    volumes: *app-volumes
    depends_on: *app-depends
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2g
    stop_grace_period: 60s
    healthcheck:
      # The image's own HEALTHCHECK is the php-fpm ping; declaring it here also
      # gives `docker compose ps` and the depends_on graph something to wait on.
      test: ["CMD", "/usr/local/bin/php-fpm-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Nginx — the only service exposed to the internet
  # ───────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      # Assets come from the image build, not from the host checkout.
      - app-public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks: [backend, edge]

  # ───────────────────────────────────────────────────────────────────────────
  # Horizon — queue workers (settlement, payouts, webhooks, notifications)
  # ───────────────────────────────────────────────────────────────────────────
  horizon:
    <<: [*app-image, *app-hardening]
    restart: unless-stopped
    environment:
      <<: *app-env
    command: ["php", "artisan", "horizon"]
    secrets: *app-secrets
    volumes: *app-volumes
    depends_on: *app-depends
    # 120s so an in-flight payout transaction can commit or roll back cleanly.
    stop_grace_period: 120s
    healthcheck:
      # `horizon:status` exits non-zero when no master supervises the pool; the
      # container being alive is not the same as workers existing.
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Scheduler — EXACTLY ONE replica. Two schedulers double-fire every task.
  # ───────────────────────────────────────────────────────────────────────────
  scheduler:
    <<: [*app-image, *app-hardening]
    restart: unless-stopped
    environment:
      <<: *app-env
    command: ["php", "artisan", "schedule:work"]
    secrets: *app-secrets
    volumes: *app-volumes
    depends_on: *app-depends
    stop_grace_period: 60s
    healthcheck:
      # The heartbeat the scheduler writes each minute; `ops:health` reads the
      # same file. A scheduler that is up but not scheduling fails here.
      test: ["CMD", "php", "artisan", "ops:heartbeat", "--show"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Reverb — WebSocket server for result pushes
  # ───────────────────────────────────────────────────────────────────────────
  reverb:
    <<: [*app-image, *app-hardening]
    restart: unless-stopped
    environment:
      <<: *app-env
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    secrets: *app-secrets
    volumes: *app-volumes
    depends_on: *app-depends
    stop_grace_period: 30s
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Rust settlement worker — the hot path
  # ───────────────────────────────────────────────────────────────────────────
  settlement-worker:
    build:
      context: .
      dockerfile: docker/rust/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      WORKER_BIND: "0.0.0.0:9101"
      RUST_LOG: "info"
      PRIZE_PAYOUT_SAFETY_MODE: "${PRIZE_PAYOUT_SAFETY_MODE:-DISABLED}"
      # The worker reads DATABASE_URL from the environment and falls back to the
      # file Docker mounts at /run/secrets/database_url (see main.rs). Passing a
      # `DATABASE_URL_FILE` variable would look like configuration while being
      # read by nothing, so the mount is relied on directly.
      #
      # NOTE: settlement_worker_hmac_secret is mounted because request-signature
      # verification lives in the worker, but the current worker source never
      # loads it — an application-level gap recorded in HANDOFF-C.md, not a
      # container one.
    secrets:
      - database_url
      - settlement_worker_hmac_secret
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The worker's own --healthcheck mode; there is no shell in this image.
      test: ["CMD", "/settlement-worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks: [backend]

  # ───────────────────────────────────────────────────────────────────────────
  # Backup — not a daemon. Run on demand or from the host's cron:
  #   docker compose --profile ops run --rm backup
  # The archive lands in the app-storage volume and is pruned by the command.
  # ───────────────────────────────────────────────────────────────────────────
  backup:
    <<: [*app-image, *app-hardening]
    profiles: [ops]
    restart: "no"
    environment:
      <<: *app-env
    command: ["bash", "scripts/ops/backup.sh", "--json"]
    secrets: *app-secrets
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    # No route off the host: the database, Redis and Reverb are unreachable from
    # anything except the containers above.
    internal: true

volumes:
  db-data:
  redis-data:
  # storage and public are populated by the image build. A fresh named volume
  # inherits the image's directory contents AND ownership, so uid 10001 can
  # write to storage from the first request.
  app-storage:
  app-public:
  app-bootstrap-cache:

secrets:
  app_key:
    external: true
  db_password:
    external: true
  db_root_password:
    external: true
  backup_key:
    external: true
  health_token:
    external: true
  database_url:
    external: true
  settlement_worker_hmac_secret:
    external: true
