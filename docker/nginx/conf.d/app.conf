user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$http_x_request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time,'
        '"upstream_rt":"$upstream_response_time"}';
    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_general:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream php_fpm {
        server app:9000;
        keepalive 32;
    }

    upstream reverb {
        server reverb:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/html/public;
            try_files $uri =404;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        root /var/www/html/public;
        index index.php;
        server_tokens off;
        client_max_body_size 2m;
        limit_conn connections 40;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location ^~ /app {
            proxy_pass http://reverb;
            include /etc/nginx/snippets/websocket.conf;
        }

        location ^~ /apps {
            proxy_pass http://reverb;
            include /etc/nginx/snippets/websocket.conf;
        }

        location = /api/v1/auth/login {
            limit_req zone=api_auth burst=5 nodelay;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.php?$query_string;
        }

        location ^~ /api/v1/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.php?$query_string;
        }

        location = /broadcasting/auth {
            limit_req zone=api_auth burst=10 nodelay;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.php?$query_string;
        }

        location = /api/v1/deposit/slip-verification {
            client_max_body_size 12m;
            limit_req zone=api_general burst=20 nodelay;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.php?$query_string;
        }

        location ^~ /api/v1/deposit/slip-verification/ {
            client_max_body_size 12m;
            limit_req zone=api_general burst=20 nodelay;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.php?$query_string;
        }

        location ~ ^/api/v1/(payments/(webhook|bank-webhook|payout-webhook)/|payments/stripe-followups|deposit/truemoney/redeem) {
            limit_req zone=webhook burst=100 nodelay;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.php?$query_string;
        }

        location ^~ /api/ {
            limit_req zone=api_general burst=60 nodelay;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.php?$query_string;
        }

        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            try_files $uri =404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location ~* /(storage|bootstrap|config|database|app|tests|vendor)/ {
            deny all;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php_fpm;
            fastcgi_index index.php;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            access_log off;
            try_files $uri =404;
        }

        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    }
}
