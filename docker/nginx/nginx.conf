# =============================================================================
# Nginx — Thai Lottery edge
# =============================================================================
# Points that matter for a real-money platform, called out inline:
#
#   - /api/* and /webhooks/* are NEVER cached, at any layer.
#   - Rate limits exist at the EDGE as well as in Laravel. The application's
#     ThrottleRequests limiter is per-driver and runs after PHP has booted; an
#     edge limit refuses a flood before it costs a PHP worker. Two layers, and
#     the edge one is the cheap one.
#   - Real client IP is preserved through the proxy chain, because every
#     audit log, rate limit bucket and device-signature check depends on it.
#   - WebSocket upgrade path for Reverb.
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Real client IP. Without this, every downstream limit is keyed on the
    #    load balancer's address and per-IP throttling collapses to one bucket.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    log_format json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$http_x_request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time,'
        '"upstream_rt":"$upstream_response_time",'
        '"ua":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    client_max_body_size 12M;
    client_body_timeout  15s;
    client_header_timeout 15s;
    send_timeout         30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ── Edge rate limits ────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_bet:20m     rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webhook:10m     rate=60r/s;
    limit_req_zone $binary_remote_addr zone=public_read:20m rate=20r/s;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── Upstream ────────────────────────────────────────────────────────────
    upstream php-fpm {
        server app:9000;
        keepalive 64;
    }

    # ── Reverb (WebSocket) ──────────────────────────────────────────────────
    upstream reverb {
        server reverb:8080;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP → HTTPS ────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge must stay on HTTP.
        location /.well-known/acme-challenge/ {
            root /var/www/html/public;
        }

        location / {
            return 301 https://$host$request_uri;
        }

        location /up {
            access_log off;
            proxy_pass http://php-fpm;
            include /etc/nginx/fastcgi_params;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS. Only correct with a valid certificate on every subdomain.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /var/www/html/public;
        index index.php;

        limit_conn conn_per_ip 40;

        # ── WebSocket (Reverb) ──────────────────────────────────────────────
        location /app {
            proxy_pass http://reverb;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Auth: the tightest limit on the platform ────────────────────────
        location = /api/v1/auth/login {
            limit_req zone=api_auth burst=5 nodelay;
            try_files $uri /index.php?$query_string;
        }

        location ^~ /api/v1/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            try_files $uri /index.php?$query_string;
        }

        # ── Bet placement: tight, but high enough for a real player ─────────
        location ^~ /api/v1/bets/ {
            limit_req zone=api_bet burst=20 nodelay;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.php?$query_string;
        }

        # ── Webhooks: generous rate, because a provider retry burst is not an
        #    attack — signature verification is the real control.
        location ^~ /webhooks/ {
            limit_req zone=webhook burst=100 nodelay;
            add_header Cache-Control "no-store" always;
            access_log /var/log/nginx/webhooks.log json;
            try_files $uri /index.php?$query_string;
        }

        # ── Everything else under /api: never cache ─────────────────────────
        location ^~ /api/ {
            limit_req zone=api_general burst=60 nodelay;
            # A balance, a bet status or a payout state must never be answered
            # from a cache. `no-store` is the directive that also prevents
            # intermediary caches from holding it.
            add_header Cache-Control "no-store" always;
            try_files $uri /index.php?$query_string;
        }

        # ── Public pages: short cache, no cookies ───────────────────────────
        location ~* ^/(results|results/|lottery/|about|vision|terms|fees|privacy) {
            limit_req zone=public_read burst=40 nodelay;
            try_files $uri /index.php?$query_string;
        }

        # ── Static ──────────────────────────────────────────────────────────
        location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            expires 1h;
            try_files $uri =404;
        }

        # ── Health (no logging, no rate limit) ──────────────────────────────
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        # ── Deny hidden files and anything that is not meant to be public ───
        location ~ /\.(?!well-known).* {
            deny all;
        }

        location ~* /(storage|bootstrap|config|database|app|tests|vendor)/ {
            deny all;
        }

        # ── PHP ─────────────────────────────────────────────────────────────
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_intercept_errors off;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    }
}
