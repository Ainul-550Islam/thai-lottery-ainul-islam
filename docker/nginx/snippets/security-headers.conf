# =============================================================================
# Security headers — shared edge snippet (Audit §E1, §E2, §F7)
# =============================================================================
#
# Included inside EVERY server/location block that sets any `add_header` so nginx
# inheritance rules never drop HSTS, framing, MIME-sniffing, referrer, COOP/CORP,
# or permissions headers on any response.
#
# NOTE ON Content-Security-Policy:
# Dynamic PHP responses receive a single authoritative per-request cryptographic
# `'nonce-<random>'` `Content-Security-Policy` header from Laravel's
# `App\Http\Middleware\SecurityHeaders` (zero `'unsafe-inline'` in `script-src`).
# Emitting a second static `Content-Security-Policy` on `location ~ \.php$` would
# intersect with and strip the per-request nonce in browsers. Static locations
# in `nginx.conf` explicitly set `default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'`.
# =============================================================================

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
