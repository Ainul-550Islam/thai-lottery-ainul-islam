; PHP-FPM pool for the Thai Lottery application tier.
;
; PROCESS MODEL
; `pm = dynamic` because the web tier's load is bursty (draw announcements) and
; static sizing would either over-provision at 3am or queue requests at 8pm.
; The values below are the starting point for a 4-vCPU node; the arithmetic is
; max_children * average worker RSS must fit in the container's memory limit
; with headroom, or the OOM killer starts reaping PHP workers mid-transaction.
;
; WARNING FOR THE SETTLEMENT LANE: this pool serves HTTP requests ONLY. Draw
; settlement runs in Horizon workers with their own limits. A settlement that
; ran inside a php-fpm worker would be killed by request_terminate_timeout, and
; a killed worker mid-transaction is how a draw ends up needing manual repair.

[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = app
group = app

listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16

; Recycle a worker every 500 requests. Long-lived PHP workers accumulate
; memory from libraries that leak at the edges; recycling bounds that drift and
; makes a slow leak a non-event instead of a nightly 3am page.
pm.max_requests = 500

; A REQUEST THAT RUNS LONGER THAN THIS IS KILLED. 60s matches max_execution_time
; and is generous for anything the web tier legitimately does. If a request
; needs longer, it is work that belongs on a queue.
request_terminate_timeout = 60s

; Return 503 rather than queueing forever. A client that gets a fast 503 can
; retry; a client that waits 90s for a timeout has already given up and the
; worker spent 90s on a request nobody is listening for.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; ── Status page: scraped by the health check and Prometheus ───────────────
pm.status_path = /fpm-status
ping.path = /fpm-ping

; ── Environment hygiene ───────────────────────────────────────────────────
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no

; Security: never expose PHP version or the FPM status page to the internet.
; The nginx config does not route /fpm-status publicly; this is belt and braces.
php_admin_flag[expose_php] = off
security.limit_extensions = .php
