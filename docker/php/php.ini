; Production PHP settings for the Thai Lottery runtime.
; Every value here is a decision, annotated with why.

; ── Errors ────────────────────────────────────────────────────────────────
; Never display. Errors go to stderr, which the container runtime collects.
; display_errors=On on a financial platform leaks file paths, SQL fragments and
; sometimes credentials into an HTTP response.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED
html_errors = Off

; ── Money-critical ────────────────────────────────────────────────────────
; bcmath scale must be high enough that intermediate steps in a payout never
; silently truncate. The application rounds explicitly at the boundary; this is
; the floor beneath that.
bcmath.scale = 10

; ── OPcache ───────────────────────────────────────────────────────────────
; validate_timestamps=0 means OPcache never stats a file to see if it changed.
; That is correct ONLY because the image is immutable and rebuilt per deploy.
; With a bind-mounted source tree it would serve stale code forever.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; ── Limits ────────────────────────────────────────────────────────────────
; Settling a large draw in a worker needs headroom; a request never should.
max_execution_time = 60
max_input_time = 30
memory_limit = 512M
post_max_size = 12M
upload_max_filesize = 10M
max_input_vars = 3000

; ── Sessions and cookies ──────────────────────────────────────────────────
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1
expose_php = Off

; ── Realpath cache ────────────────────────────────────────────────────────
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; ── Timezone ──────────────────────────────────────────────────────────────
; UTC internally; the application converts at the edges. Bangkok is UTC+7 with
; no DST, which makes this unambiguous — but a server-local timezone would still
; make every stored timestamp depend on where the container happened to start.
date.timezone = UTC
