apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-clamav
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-clamav
spec:
  replicas: {{ .Values.clamav.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-clamav
    spec:
      containers:
        - name: clamav
          image: "{{ .Values.clamav.image }}"
          ports:
            - name: clamd
              containerPort: {{ .Values.clamav.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.clamav.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-clamav
spec:
  type: ClusterIP
  ports:
    - port: 3310
      targetPort: clamd
      protocol: TCP
      name: clamd
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-clamav
