{{- if .Values.settlementWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-settlement-worker
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-settlement-worker
spec:
  replicas: {{ .Values.settlementWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-settlement-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-settlement-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: settlement-worker
          image: "{{ .Values.settlementWorker.image.repository }}:{{ .Values.settlementWorker.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.settlementWorker.image.pullPolicy }}
          ports:
            - name: health
              containerPort: {{ .Values.settlementWorker.port }}
              protocol: TCP
          env:
            - name: WORKER_BIND
              value: "0.0.0.0:{{ .Values.settlementWorker.port }}"
            - name: RUST_LOG
              value: info
            - name: PRIZE_PAYOUT_SAFETY_MODE
              value: "DISABLED"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DATABASE_URL
            - name: SETTLEMENT_WORKER_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: SETTLEMENT_WORKER_HMAC_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.settlementWorker.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: health
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: health
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-settlement-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-settlement-worker
  ports:
    - name: health
      port: {{ .Values.settlementWorker.port }}
      targetPort: health
      protocol: TCP
{{- end }}
