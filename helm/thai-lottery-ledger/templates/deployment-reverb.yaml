{{- if .Values.reverb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-reverb
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-reverb
spec:
  replicas: {{ .Values.reverb.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-reverb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-reverb
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      initContainers:
        - name: prepare-storage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c", "mkdir -p /shared/app/private /shared/app/public /shared/framework/cache/data /shared/framework/sessions /shared/framework/views /shared/logs"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: app-storage
              mountPath: /shared
      containers:
        - name: reverb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
          ports:
            - name: ws
              containerPort: {{ .Values.reverb.port }}
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: ws
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: ws
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: ws
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.reverb.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          volumeMounts:
            - name: php-temp
              mountPath: /tmp
            - name: app-storage
              mountPath: /var/www/html/storage
      volumes:
        - name: php-temp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: app-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-app-storage
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-reverb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-reverb
  ports:
    - name: ws
      port: {{ .Values.reverb.port }}
      targetPort: ws
{{- end }}
