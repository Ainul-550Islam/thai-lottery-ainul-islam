apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-app
  ports:
    - name: fpm
      port: {{ .Values.service.port }}
      targetPort: fpm
      protocol: TCP
