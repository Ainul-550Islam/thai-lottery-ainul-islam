{{- $storeName := required "externalSecretStoreName must identify the configured ClusterSecretStore" .Values.externalSecretStoreName }}
{{- $host := required "ingress.host must be configured before installing the production chart" .Values.ingress.host }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  {{- toYaml .Values.env | nindent 2 }}
  APP_URL: {{ printf "https://%s" $host | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $storeName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: APP_KEY
    - secretKey: FIELD_ENCRYPTION_KEY
      remoteRef:
        key: FIELD_ENCRYPTION_KEY
    - secretKey: DB_HOST
      remoteRef:
        key: DB_HOST
    - secretKey: DB_USERNAME
      remoteRef:
        key: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: DB_PASSWORD
    - secretKey: REDIS_HOST
      remoteRef:
        key: REDIS_HOST
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: REDIS_PASSWORD
    - secretKey: REVERB_APP_ID
      remoteRef:
        key: REVERB_APP_ID
    - secretKey: REVERB_APP_KEY
      remoteRef:
        key: REVERB_APP_KEY
    - secretKey: REVERB_APP_SECRET
      remoteRef:
        key: REVERB_APP_SECRET
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE_URL
    - secretKey: SETTLEMENT_WORKER_HMAC_SECRET
      remoteRef:
        key: SETTLEMENT_WORKER_HMAC_SECRET
    - secretKey: BKASH_APP_KEY
      remoteRef:
        key: BKASH_APP_KEY
        optional: true
    - secretKey: BKASH_APP_SECRET
      remoteRef:
        key: BKASH_APP_SECRET
        optional: true
    - secretKey: BKASH_PASSWORD
      remoteRef:
        key: BKASH_PASSWORD
        optional: true
    - secretKey: BKASH_USERNAME
      remoteRef:
        key: BKASH_USERNAME
        optional: true
    - secretKey: NAGAD_APP_KEY
      remoteRef:
        key: NAGAD_APP_KEY
        optional: true
    - secretKey: NAGAD_APP_SECRET
      remoteRef:
        key: NAGAD_APP_SECRET
        optional: true
    - secretKey: NAGAD_MERCHANT_ID
      remoteRef:
        key: NAGAD_MERCHANT_ID
        optional: true
    - secretKey: NAGAD_MERCHANT_NUMBER
      remoteRef:
        key: NAGAD_MERCHANT_NUMBER
        optional: true
    - secretKey: NAGAD_PRIVATE_KEY
      remoteRef:
        key: NAGAD_PRIVATE_KEY
        optional: true
    - secretKey: NAGAD_PUBLIC_KEY
      remoteRef:
        key: NAGAD_PUBLIC_KEY
        optional: true
    - secretKey: CRYPTO_GATEWAY_API_KEY
      remoteRef:
        key: CRYPTO_GATEWAY_API_KEY
        optional: true
    - secretKey: CRYPTO_GATEWAY_API_SECRET
      remoteRef:
        key: CRYPTO_GATEWAY_API_SECRET
        optional: true
    - secretKey: CRYPTO_GATEWAY_WEBHOOK_SECRET
      remoteRef:
        key: CRYPTO_GATEWAY_WEBHOOK_SECRET
        optional: true
    - secretKey: SCB_WEBHOOK_SECRET
