      tags: [Health]
      operationId: healthReady
      summary: Readiness probe
      description: |
        Database, cache, queue, a fresh scheduler heartbeat, and the CONFIG
        status of the payment and result providers. Returns 503 when any check
        fails. The body carries a closed vocabulary of reason codes and never a
        secret, host, DSN or member data.
      security: []
