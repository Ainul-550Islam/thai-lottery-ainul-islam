openapi: 3.0.3
info:
  title: Player Experience API (Batch 3)
  version: 1.0.0
  description: |
    Hand-written contract for the Batch 3 player surface. No generator and no
    composer dependency is used (Rule 8).

    SCOPE OF THIS FILE
    Every route registered by Batch 3 is documented here: the bet slip, My Bets,
    wallet overview and feed, profile overview, security overview and alerts,
    notification preferences, support conversations, active promotions,
    responsible-gaming summary, public compliance badges and the two health probes.

    Routes belonging to Batch 1 and Batch 2 (for example anything under
    /api/v1/games) are NOT present in the repository this file was written
    against. `tests/Feature/Api/OpenApiCoverageTest.php` fails automatically the
    day such a route is registered without an entry below, so the contract cannot
    silently fall behind.

    CONVENTIONS
    - Money is ALWAYS a decimal string with two places ("1250.00"). Never a number.
    - A value that is unknown is `null`. It is never a made-up zero and never a
      demo figure.
    - Success envelope: `{ "success": true, "message": string, "data": object, "meta"?: object }`.
    - Error envelope: `{ "success": false, "message": string, "code": string }`
      produced by `App\Support\ApiResponse::error(code, message, status)`.
      That class is not part of the Batch 3 package: confirm the exact error key
      name against it when generating a client.
    - Authentication is a Sanctum bearer token. Every `/me/*` route also passes
      the `active` middleware, so a suspended account receives 403.
servers:
  - url: /
    description: Same origin as the application.
tags:
  - name: BetSlip
  - name: MyBets
  - name: Wallet
  - name: Profile
  - name: Security
  - name: Notifications
  - name: Support
  - name: Promotions
  - name: Compliance
  - name: Health
  - name: Games
  - name: BankAccounts
  - name: Cashback
  - name: Dashboard
  - name: Referral
  - name: Rewards
security:
  - bearerAuth: []
paths:
  /api/v1/me/bet-slip:
    get:
      tags: [BetSlip]
      operationId: getBetSlip
      summary: Current draft slip with server-side pricing
      description: |
        Never creates a slip. With no draft the response carries `slip: null`
        and an empty, priceable pricing block.
      responses:
        '200':
          description: Draft slip (or none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetSlipEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [BetSlip]
      operationId: clearBetSlip
      summary: Remove every selection from the draft slip
      responses:
        '200':
          description: Slip cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetSlipEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/bet-slip/items:
    post:
      tags: [BetSlip]
      operationId: addBetSlipItem
      summary: Add a selection (or raise the stake of an identical one)
      description: |
        The selection is validated against the markets the project actually
        sells. Unknown games are refused with `game_not_available`; the
        mockup-only "GLO L6 2D/3D direct bet" is refused with
        `game_not_implemented`. Only `wallet` funding is accepted in this
        release. Totals and potential win are computed by the server; any
        client-supplied total, status or payout is rejected as prohibited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBetSlipItemRequest'
      responses:
        '201':
          description: Selection added or merged into an existing line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetSlipItemAddedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/bet-slip/items/{item}:
    delete:
      tags: [BetSlip]
      operationId: removeBetSlipItem
      summary: Remove one selection
      parameters:
        - name: item
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Selection removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetSlipEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/bet-slip/confirm:
    post:
      tags: [BetSlip]
      operationId: confirmBetSlip
      summary: Buy every selection on the slip, or none
      description: |
        Single database transaction. Each selection is re-validated and bought
        through the existing purchase pipeline; if any one is refused the whole
        confirm rolls back and the wallet is untouched.

        IDEMPOTENCY: send `Idempotency-Key` (8-96 characters of letters, digits,
        colon, dash, underscore). A replay of an already-confirmed key returns
        200 with `replayed: true` and buys nothing. The same value may be sent
        as `idempotency_key` in the body; the header wins. A request with
        neither is refused with 400 `invalid_idempotency_key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmBetSlipRequest'
      responses:
        '200':
          description: Replay of an already-confirmed key. Nothing was bought.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetSlipConfirmedEnvelope'
        '201':
          description: Slip confirmed and bets placed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetSlipConfirmedEnvelope'
        '400':
          description: Missing or malformed idempotency key (`invalid_idempotency_key`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No open slip (`no_active_slip`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The slip expired (`slip_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            Refused: `slip_empty`, `funding_source_unavailable`,
            `item_missing_draw` or `purchase_refused`. Nothing was charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/bets:
    get:
      tags: [MyBets]
      operationId: listMyBets
      summary: The member's bets, filtered by tab
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, confirmed, cancelled, winning]
            default: all
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Must be on or after `from`.
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: One page of bets. `winning` means settled with a payout above zero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyBetsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/bets/counts:
    get:
      tags: [MyBets]
      operationId: getMyBetCounts
      summary: The five tab counts from one grouped query
      description: The counts equal the totals of the corresponding filtered lists.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Tab counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyBetCountsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/bets/{bet}:
    get:
      tags: [MyBets]
      operationId: getMyBet
      summary: One bet with its draw and result
      description: |
        A bet that belongs to someone else returns 404, identical to one that
        does not exist, so an identifier probe learns nothing.
      parameters:
        - name: bet
          in: path
          required: true
          description: Bet id or bet number.
          schema:
            type: string
      responses:
        '200':
          description: The bet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyBetEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/wallet/overview:
    get:
      tags: [Wallet]
      operationId: getWalletOverview
      summary: Four balances, 7-day trend and an optional display-only FX figure
      description: |
        Read-only. `cashback` is null when no cashback reader is installed.
        `trend.percent` is null without a snapshot at the horizon or when the
        baseline is zero. `fx` is null unless the operator enabled it and a
        fresh snapshot exists; it is APPROXIMATE and is never used to move money.
      responses:
        '200':
          description: Wallet overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletOverviewEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/wallet/transactions:
    get:
      tags: [Wallet]
      operationId: listWalletTransactions
      summary: Unified ledger feed with cursor pagination
      parameters:
        - name: type
          in: query
          schema:
            type: string
            description: '`all` or one of the WalletFeedType filter values.'
            default: all
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: One page of feed items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletFeedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/profile/overview:
    get:
      tags: [Profile]
      operationId: getProfileOverview
      summary: Masked personal info, verification statuses and balances
      responses:
        '200':
          description: Profile overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOverviewEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/security/overview:
    get:
      tags: [Security]
      operationId: getSecurityOverview
      summary: Score computed from real checks, plus device and session counts
      description: |
        score = sum of the configured weights of the checks that passed. The
        score can reach 100 percent only when every check passes.
      responses:
        '200':
          description: Security overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityOverviewEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/security/alerts:
    get:
      tags: [Security]
      operationId: listSecurityAlerts
      summary: Alerts projected from existing security events
      responses:
        '200':
          description: Alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityAlertsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/notification-preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: Preference matrix with mandatory categories flagged
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Notifications]
      operationId: updateNotificationPreferences
      summary: Update preferences
      description: |
        A mandatory category (security, deposit/withdrawal status, KYC,
        responsible gaming, account restriction) can never be disabled. The
        attempt is refused with 422 `mandatory_category`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: Updated matrix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/support/conversations:
    get:
      tags: [Support]
      operationId: listSupportConversations
      summary: The member's own conversations
      responses:
        '200':
          description: Conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportConversationsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Support]
      operationId: openSupportConversation
      summary: Open a conversation (respects the configured open-conversation cap)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSupportConversationRequest'
      responses:
        '201':
          description: Conversation opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportConversationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/support/conversations/{id}/messages:
    get:
      tags: [Support]
      operationId: listSupportMessages
      summary: Messages in the member's own conversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportMessagesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Support]
      operationId: sendSupportMessage
      summary: Send a message
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSupportMessageRequest'
      responses:
        '201':
          description: Message accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportMessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/support/conversations/{id}/rating:
    post:
      tags: [Support]
      operationId: rateSupportConversation
      summary: Rate a conversation once
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateSupportConversationRequest'
      responses:
        '200':
          description: Rating stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportConversationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/promotions/active:
    get:
      tags: [Promotions]
      operationId: listActivePromotions
      summary: Active points-multiplier campaigns and public bonuses
      description: An empty list is the honest answer when nothing is running.
      responses:
        '200':
          description: Active promotions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivePromotionsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/responsible-gaming/summary:
    get:
      tags: [Compliance]
      operationId: getResponsibleGamingSummary
      summary: Read-only summary of limits and self-exclusion
      description: There is no write path on this endpoint.
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/games:
    get:
      tags: [Games]
      operationId: listGames
      summary: Lottery games available to the caller
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/games/{code}:
    get:
      tags: [Games]
      operationId: getGame
      summary: One game and its rules
      parameters:
        - name: code
          in: path
          required: true
          description: Game code, for example `weekly` or `thai-government`.
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/games/{code}/upcoming:
    get:
      tags: [Games]
      operationId: listGameUpcomingDraws
      summary: Upcoming draws for a game
      parameters:
        - name: code
          in: path
          required: true
          description: Game code, for example `weekly` or `thai-government`.
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/games/{code}/calendar:
    get:
      tags: [Games]
      operationId: getGameCalendar
      summary: Draw calendar for a game
      parameters:
        - name: code
          in: path
          required: true
          description: Game code, for example `weekly` or `thai-government`.
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/games/{code}/results:
    get:
      tags: [Games]
      operationId: listGameResults
      summary: Published result history for a game
      parameters:
        - name: code
          in: path
          required: true
          description: Game code, for example `weekly` or `thai-government`.
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/games/{code}/results/latest:
    get:
      tags: [Games]
      operationId: getGameLatestResult
      summary: Latest published result for a game
      parameters:
        - name: code
          in: path
          required: true
          description: Game code, for example `weekly` or `thai-government`.
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/games/{code}/bets/quote:
    post:
      tags: [Games]
      operationId: quoteGameBet
      summary: Price a bet without placing it
      parameters:
        - name: code
          in: path
          required: true
          description: Game code, for example `weekly` or `thai-government`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
