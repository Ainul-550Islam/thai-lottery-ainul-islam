        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 8-96 characters; letters, digits, colon, dash, underscore.
      schema:
        type: string
        minLength: 8
        maxLength: 96
        pattern: '^[A-Za-z0-9:_\-]+$'
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthenticated:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The account is not active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found, or not owned by the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: |
        Validation failed or a business rule refused the request. The `code`
        names the rule (for example `game_not_available`, `game_not_implemented`,
        `funding_source_unsupported`, `mandatory_category`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: '1250.00'
      description: Decimal string, two places. Never a JSON number.
    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        code:
          type: string
          description: Stable machine-readable reason.
    GenericEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    BetSlip:
      type: object
      properties:
        id:
          type: integer
        reference:
          type: string
        status:
          type: string
          enum: [draft, confirmed, expired]
        currency:
          type: string
        item_count:
          type: integer
        total_stake:
          $ref: '#/components/schemas/Money'
        expires_at:
          type: string
          format: date-time
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        confirmed_reference:
          type: string
          nullable: true
        editable:
          type: boolean
    BetSlipPricing:
      type: object
      properties:
        currency:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        total_stake:
          $ref: '#/components/schemas/Money'
        total_potential_win:
          $ref: '#/components/schemas/Money'
        provisional:
          type: boolean
        priceable:
          type: boolean
    BetSlipEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            slip:
              allOf:
                - $ref: '#/components/schemas/BetSlip'
              nullable: true
            pricing:
              $ref: '#/components/schemas/BetSlipPricing'
            max_items:
              type: integer
    BetSlipItemAddedEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            slip:
              $ref: '#/components/schemas/BetSlip'
            pricing:
              $ref: '#/components/schemas/BetSlipPricing'
            merged:
              type: boolean
    BetSlipConfirmedEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            slip:
              $ref: '#/components/schemas/BetSlip'
            bets:
              type: array
              items:
                type: object
                properties:
                  bet_number:
                    type: string
                  bet_id:
                    type: integer
                  game_code:
                    type: string
                  number:
                    type: string
                  stake:
                    $ref: '#/components/schemas/Money'
                  status:
                    type: string
                  potential_payout:
                    $ref: '#/components/schemas/Money'
                  ticket_number:
                    type: string
                    nullable: true
            total_stake:
              $ref: '#/components/schemas/Money'
            replayed:
              type: boolean
    AddBetSlipItemRequest:
      type: object
      required: [game_code, bet_type, number, stake]
      properties:
        game_code:
          type: string
          maxLength: 40
        bet_type:
          type: string
          maxLength: 24
        number:
          type: string
          maxLength: 12
          description: A string so leading zeros survive ("007").
        stake:
          type: string
          maxLength: 24
          description: Exact decimal string; a JSON number is refused.
        funding_source:
          type: string
          enum: [wallet]
        draw_id:
          type: integer
          minimum: 1
        free_bet_voucher_reference:
          type: string
          maxLength: 64
          description: Accepted by the schema, refused by the service in this release.
    ConfirmBetSlipRequest:
      type: object
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 96
          description: Alternative to the header; the header wins.
    MyBet:
      type: object
      properties:
        id:
          type: integer
        bet_number:
          type: string
        status:
          type: string
        type:
          type: string
          nullable: true
        currency:
          type: string
        stake:
          $ref: '#/components/schemas/Money'
        potential_payout:
          $ref: '#/components/schemas/Money'
        actual_payout:
          $ref: '#/components/schemas/Money'
        is_winning:
          type: boolean
        draw:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            draw_number:
              type: string
            status:
              type: string
              nullable: true
            scheduled_at:
              type: string
              format: date-time
              nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
    MyBetsEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            bets:
              type: array
              items:
                $ref: '#/components/schemas/MyBet'
        meta:
          type: object
          properties:
            filter:
              type: string
            pagination:
              type: object
              properties:
                total:
                  type: integer
                per_page:
                  type: integer
                current_page:
                  type: integer
                last_page:
                  type: integer
    MyBetEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          additionalProperties: true
    MyBetCountsEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            counts:
              type: object
              properties:
                all:
                  type: integer
                pending:
                  type: integer
                confirmed:
                  type: integer
                cancelled:
                  type: integer
                winning:
                  type: integer
    WalletOverviewEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            wallet:
              type: object
              properties:
                currency:
                  type: string
                balances:
                  type: object
                  properties:
                    main:
                      $ref: '#/components/schemas/Money'
                    win:
                      $ref: '#/components/schemas/Money'
                    bonus:
                      $ref: '#/components/schemas/Money'
                    cashback:
                      allOf:
                        - $ref: '#/components/schemas/Money'
                      nullable: true
                cashback_available:
                  type: boolean
                trend:
                  type: object
                  properties:
                    days:
                      type: integer
                    percent:
                      type: string
                      nullable: true
                    available:
                      type: boolean
                    baseline:
                      type: string
                      nullable: true
                    baseline_date:
                      type: string
                      nullable: true
                fx:
                  type: object
                  nullable: true
                  description: |
                    DISPLAY ONLY. Carries `approximate: true` and `captured_at`.
