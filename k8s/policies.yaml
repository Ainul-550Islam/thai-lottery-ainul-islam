apiVersion: v1
kind: ServiceAccount
metadata:
  name: thai-lottery-app
  namespace: fintech-production
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thai-lottery-nginx-edge
  namespace: fintech-production
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thai-lottery-horizon
  namespace: fintech-production
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thai-lottery-reverb
  namespace: fintech-production
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thai-lottery-scheduler
  namespace: fintech-production
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thai-lottery-settlement-worker
  namespace: fintech-production
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thai-lottery-migrate
  namespace: fintech-production
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thai-lottery-app
  namespace: fintech-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: thai-lottery-app
      app.kubernetes.io/component: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thai-lottery-nginx-edge
  namespace: fintech-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thai-lottery-nginx-edge
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thai-lottery-horizon
  namespace: fintech-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thai-lottery-horizon
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thai-lottery-reverb
  namespace: fintech-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thai-lottery-reverb
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thai-lottery-settlement-worker
  namespace: fintech-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thai-lottery-settlement-worker
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: fintech-production
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-traffic
  namespace: fintech-production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thai-lottery-app
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: thai-lottery-nginx-edge
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: thai-lottery-reverb
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-edge-traffic
  namespace: fintech-production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thai-lottery-nginx-edge
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: thai-lottery-app
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: thai-lottery-reverb
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reverb-traffic
  namespace: fintech-production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thai-lottery-reverb
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: thai-lottery-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: thai-lottery-nginx-edge
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-client-egress
  namespace: fintech-production
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - thai-lottery-horizon
          - thai-lottery-scheduler
          - thai-lottery-settlement-worker
          - thai-lottery-migration
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
