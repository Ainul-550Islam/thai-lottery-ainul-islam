apiVersion: batch/v1
kind: Job
metadata:
  name: thai-lottery-migrate
  namespace: fintech-production
  labels:
    app.kubernetes.io/name: thai-lottery
    app.kubernetes.io/component: migration
  annotations:
    deployment.kubernetes.io/revision: "pre-deploy"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thai-lottery-migration
    spec:
      restartPolicy: Never
      serviceAccountName: thai-lottery-migrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-storage
          image: ghcr.io/ainul-550islam/thai-lottery-app:sha-ad253c07957e3cc0df59c28526e478affff9d7c2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "mkdir -p /shared/app/private /shared/app/public /shared/framework/cache/data /shared/framework/sessions /shared/framework/views /shared/logs"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: app-storage
              mountPath: /shared
      containers:
        - name: migrate
          image: ghcr.io/ainul-550islam/thai-lottery-app:sha-ad253c07957e3cc0df59c28526e478affff9d7c2
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "migrate", "--force", "--isolated"]
          envFrom:
            - configMapRef:
                name: fintech-config
            - secretRef:
                name: fintech-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: php-temp
              mountPath: /tmp
            - name: app-storage
              mountPath: /var/www/html/storage
      volumes:
        - name: php-temp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: app-storage
          persistentVolumeClaim:
            claimName: fintech-app-storage
